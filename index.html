<html>
    <head>
        <meta charset="UTF-8">
        <script type="text/javascript" src="lib/jsgif/LZWEncoder.js"></script>
        <script type="text/javascript" src="lib/jsgif/NeuQuant.js"></script>
        <script type="text/javascript" src="lib/jsgif/GIFEncoder.js"></script>
        <script type="text/javascript" src="lib/jszip.js"></script>
        <script type="text/javascript" src="lib/FileSaver.js"></script>
        <script src="lib/ann.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body onload="ANN.initCanvas()">

        <div class="leftCol">
            <h1>Files</h1>
            <div>
                <input type="text" id="search" name="search">
            </div>
            <div id=filesys class="scrollBox">
                
            </div>
        </div>

        <div id="player">
            <div>
                <label for="width">width</label>
                <input type="number" name="width" id="canvasWidth" value="800" onchange="ANN.resizeCanvas(this.value, null)">
                <label for="height">height</label>
                <input type="number" name="height" id="canvasHeight" value="600" onchange="ANN.resizeCanvas(null, this.value)">
            </div>
            <div class="screenContainer">
            <canvas id="screen" width=800 height=600>
            </div>
            </canvas>
            <div id="playButtons">
                <label for="center">center</label>
                <input type="checkbox" name="center" id="centerCheck" onclick="ANN.changeFrame()">
                <button type="button" onclick="ANN.playB()">Back</button> 
                <button type="button" onclick="ANN.pause()">Pause</button> 
                <button type="button" onclick="ANN.play()">Play</button> 
                <div class="allBtns">
                    <button type="button" onclick="{ANN.pause(); ANN.drawMultipleFrames();}">All</button> 
                    <button type="button" onclick="{ANN.pause(); ANN.drawMultipleEvents();}">All S.</button> 
                </div>
                <label for="loop">loop</label>
                <input type="checkbox" name="loop" id="loopCheck" onclick="ANN.changeFrame()">
            </div>
            <div id="download_button">
                <button type="button" onclick="ANN.saveGif()">Save Gif</button> 
                <button type="button" onclick="ANN.saveSequence()">Save Sequence</button> 
                <button type="button" onclick="ANN.saveAnn()" style="display: none;">Save ANN</button> 
                <button type="button" onclick="ANN.saveFiles()">Save Images</button> 
            </div>
            <div id="frames">
            </div>
        </div>

        <div class="rightCol">
            <h1>Events</h1>
            <ul id="events" class="scrollBox">

            </ul>
        </div>

        <script src="lib/index.js"></script>
    </body>
</html>
